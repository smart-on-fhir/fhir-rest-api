AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM template for the FHIR REST API.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedPattern: '[A-Za-z0-9-]+'
    Description: Deployment environment name (for example dev or prod).

Resources:
  FhirDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub fhir-rest-api-${Environment}-${AWS::AccountId}
      NotificationConfiguration:
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Queue: !GetAtt NdjsonCreatedQueue.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: .ndjson

  NdjsonCreatedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub fhir-rest-api-${Environment}-ndjson-created
      # Should be >= 6x the consumer Lambda timeout per AWS guidance
      VisibilityTimeout: 5400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NdjsonCreatedDLQ.Arn
        maxReceiveCount: 1

  NdjsonCreatedDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub fhir-rest-api-${Environment}-ndjson-created-dlq
      MessageRetentionPeriod: 1209600 # 14 days

  NdjsonCreatedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NdjsonCreatedQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NdjsonCreatedQueue.Arn
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:s3:::fhir-rest-api-${Environment}-${AWS::AccountId}
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  FhirApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Sub ${Environment}
      Auth:
        DefaultAuthorizer: NONE
      EndpointConfiguration:
        Type: REGIONAL
      TracingEnabled: true
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'

  FhirFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fhir-rest-api-${Environment}
      Runtime: python3.14
      Handler: lambda_fn.lambda_handler
      CodeUri: api_src/
      MemorySize: 3600 # This should get us 2 cores
      EphemeralStorage:
        Size: 10240
      Timeout: 30
      Environment:
        Variables:
          SOURCE_BUCKET: !Sub fhir-rest-api-${Environment}-${AWS::AccountId}
          HOME: /tmp/
          LOCAL_ROOT: !Sub /tmp/fhir-rest-api-${Environment}-${AWS::AccountId}
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub fhir-rest-api-${Environment}-${AWS::AccountId}
        - Statement:
            - Effect: Allow
              Action:
                - kms:Decrypt
              Resource: '*'
      Events:
        FhirRoute:
          Type: Api
          Properties:
            RestApiId: !Ref FhirApi
            Path: /{cohort_id}/fhir/{fhir_resource}
            Method: POST
        FhirCountRoute:
          Type: Api
          Properties:
            RestApiId: !Ref FhirApi
            Path: /{cohort_id}/fhir/{fhir_resource}/count
            Method: POST
        FhirPatientRoute:
          Type: Api
          Properties:
            RestApiId: !Ref FhirApi
            Path: /{cohort_id}/fhir/patient/{patient_id}
            Method: POST
        FhirResourcesRoute:
          Type: Api
          Properties:
            RestApiId: !Ref FhirApi
            Path: /{cohort_id}/fhir/resources
            Method: GET

  ConverterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub fhir-rest-api-${Environment}-converter
      Runtime: python3.14
      Handler: lambda_fn.lambda_handler
      CodeUri: convert_src/
      MemorySize: 3600
      EphemeralStorage:
        Size: 10240
      Timeout: 900
      Environment:
        Variables:
          HOME: /tmp/
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub fhir-rest-api-${Environment}-${AWS::AccountId}
        - S3WritePolicy:
            BucketName: !Sub fhir-rest-api-${Environment}-${AWS::AccountId}
        - Statement:
            - Effect: Allow
              Action:
                - s3:DeleteObject
              Resource: !Sub arn:${AWS::Partition}:s3:::fhir-rest-api-${Environment}-${AWS::AccountId}/*
      Events:
        NdjsonCreatedQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt NdjsonCreatedQueue.Arn
            BatchSize: 10000
            # Required whenever BatchSize > 10, so Lambda waits to fill the batch
            # instead of invoking as soon as a message or two arrives.
            MaximumBatchingWindowInSeconds: 60
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  FhirAPIStageArn:
    Value: !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/${FhirApi}/stages/${Environment}"
    Export:
      Name: !Sub "${AWS::StackName}-FhirAPIArn"